{% extends "base.html" %}

{% block titre %}Honoraires / DataLynx{% endblock %}

{% block contenu %}
<section class="card form-card" id="analyse">
    <div class="section-title">
        <div>
            <span class="mini-label">Analyse principale</span>
            <h2>Consulter les honoraires</h2>
            <p>
                Remplissez le formulaire pour interroger l’API Data Ameli et afficher
                les données correspondant à votre sélection.
            </p>
        </div>
    </div>

    <form action="{{ url_for('effectifs.afficher') }}" method="get" class="form-grid">
        <div class="form-field">
            <label for="honoraires">Types d'honoraires</label>
            <select name="honoraires_id" id="honoraires" required>
                <option value="">-- Choisir un type d'honoraire --</option>
                {% for h in honoraires %}
                    <option value="{{ h.id }}">{{ h.libelle }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-field">
            <label for="region">Région</label>
            <select name="region_id" id="region" required>
                <option value="">-- Choisir une région --</option>
                {% for r in regions %}
                    <option
                        value="{{ r.id }}"
                        data-code="{{ r.code }}"
                        data-libelle="{{ r.libelle }}"
                    >
                        {{ r.libelle }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-field">
            <label for="departement">Département</label>
            <select name="departement_id" id="departement" required>
                <option value="">-- Choisir une région d’abord --</option>
            </select>
        </div>

        <div class="container-annee">
            <div class="form-field annee">
                <label for="first_year">Année de début</label>
                <select name="first_year" id="first_year" required onchange="document.querySelectorAll('#last_year option').forEach(o => o.hidden = o.value < this.value)">
                    {% for a in range(2010, 2025) %}
                        <option value="{{ a }}" {% if a == 2010 %}selected{% endif %}>{{ a }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-field annee">
                <label for="last_year">Année de fin</label>
                <select name="last_year" id="last_year" required onchange="document.querySelectorAll('#first_year option').forEach(o => o.hidden = o.value > this.value)">
                    {% for a in range(2024, 2009, -1) %}
                        <option value="{{ a }}" {% if a == 2024 %}selected{% endif %}>{{ a }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit">Afficher les résultats</button>
    </form>
</section>

<script src="{{ url_for('static', filename='js/cascade.js') }}"></script>
{% endblock %}
