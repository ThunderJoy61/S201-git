{% extends "base.html" %}

{% block titre %}Prescriptions{% endblock %}

{% block contenu %}
<section class="card form-card" id="analyse">
    <div class="section-title">
        <div>
            <span class="mini-label">Analyse principale</span>
            <h2>Consulter les prescriptions</h2>
            <p>
                Remplissez le formulaire pour interroger l’API Data Ameli et afficher
                les données correspondant à votre sélection.
            </p>
        </div>
    </div>

    <form action="{{ url_for('prescriptions.resultats') }}" method="get" class="form-grid">
        <div class="form-field">
            <label for="prescriptions">Types de prescriptions</label>
            <select name="prescription_id" id="prescriptions" required>
                <option value="">-- Choisir un type de prescription --</option>
                {% for p in prescriptions %}
                    <option value="{{ p.id }}">{{ p.libelle[0]|upper }}{{ p.libelle[1:] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-field">
            <label for="region">Région</label>
            <select name="region_id" id="region" required>
                <option value="">-- Choisir une région --</option>
                {% for r in regions %}
                    <option
                        value="{{ r.id }}"
                        data-code="{{ r.code }}"
                        data-libelle="{{ r.libelle }}"
                    >
                        {{ r.libelle }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-field">
            <label for="departement">Département</label>
            <select name="departement_id" id="departement" required>
                <option value="">-- Choisir une région d’abord --</option>
            </select>
        </div>

        <div class="form-field">
            <label for="first_year">Année</label>
            <select name="year" id="year" required>
                {% for a in range(2010, 2025) %}
                    <option value="{{ a }}" {% if a == 2024 %}selected{% endif %}>{{ a }}</option>
                {% endfor %}
            </select>
        </div>
    

        <button type="submit">Afficher les résultats</button>
    </form>
</section>

<script src="{{ url_for('static', filename='js/cascade.js') }}"></script>
{% endblock %}
