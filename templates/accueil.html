{% extends "base.html" %}

{% block titre %}Accueil{% endblock %}

{% block contenu %}
<section class="hero">
    <h2>Explorez les données de santé en France</h2>
    <p>
        Sélectionnez une profession, une région, un département et une année
        pour consulter les effectifs issus de Data Ameli.
    </p>
</section>

<section class="card">
    <h3>Consulter les effectifs</h3>

    <form action="{{ url_for('effectifs.afficher') }}" method="get" class="form-grid">
        <div>
            <label for="profession">Profession</label>
            <select name="profession_id" id="profession" required>
                <option value="">-- Choisir --</option>
                {% for p in professions %}
                    <option value="{{ p.id }}">{{ p.libelle }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="region">Région</label>
            <select name="region_id" id="region" required>
                <option value="">-- Choisir --</option>
                {% for r in regions %}
                    <option value="{{ r.id }}" data-code="{{ r.code }}" data-libelle="{{ r.libelle }}">{{ r.libelle }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="departement">Département</label>
            <select name="departement_id" id="departement" required>
                <option value="">-- Choisir une région --</option>
            </select>
        </div>

        <div>
            <label for="annee">Année</label>
            <select name="annee" id="annee" required>
                {% for a in range(2023, 2014, -1) %}
                    <option value="{{ a }}">{{ a }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Afficher les résultats</button>
    </form>
</section>

<script src="{{ url_for('static', filename='js/cascade.js') }}"></script>
{% endblock %}
